name: Dependencies

# Known-vulnerable dependencies. Besides pushes and PRs this runs weekly: an advisory can be
# published for a package that hasn't changed, and nothing else would notice until the next
# commit. A failed scheduled run is emailed to whoever last changed the schedule. Version updates
# come from Dependabot (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Advisories (npm + NuGet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm, what ships in the web app
        working-directory: web
        # Runtime dependencies only, rated high or critical. Build tooling never reaches a browser,
        # and Dependabot keeps it current; `npm audit` without --omit=dev shows it all.
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: NuGet, including transitive packages
        # `dotnet list` reports but always exits 0; the script decides (high or critical fails).
        run: |
          dotnet restore keepIT/keepITCore.slnx
          dotnet list keepIT/keepITCore.slnx package --vulnerable --include-transitive --format json \
            | python3 .github/scripts/nuget-advisories.py

  android-graph:
    name: Android dependency graph
    # Hands the Android app's resolved Gradle dependencies to GitHub's dependency graph, which has
    # no other way to see them, so Dependabot alerts cover the app's libraries too (once alerts
    # are enabled for the repository). A submission needs write access, so not from PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: app
          # The open-source cache; the default is a commercial caching service.
          cache-provider: basic

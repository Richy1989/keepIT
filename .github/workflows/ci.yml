name: CI

# Build and test every deployable on the way in, so a break is caught here rather than at
# `git tag v*` (release.yml) — which is the only workflow that used to compile anything.
# One job per deployable: they're independent by design (HTTP + WebSocket only), so they run in
# parallel and a red check names the culprit without reading the log.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch/PR makes the in-flight run obsolete — don't pay for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore keepIT/keepITCore/keepITCore.csproj
      - name: Build
        # --no-restore so a restore failure above is reported as its own step.
        run: dotnet build keepIT/keepITCore/keepITCore.csproj --configuration Release --no-restore

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        # `npm run build` is `tsc -b && vite build`: the typecheck is the real gate here, since the
        # generated API client means a changed C# DTO surfaces as TypeScript errors at every call
        # site. Building too proves the bundle still comes out.
        run: npm run build

  android:
    name: Android (Kotlin + Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile + unit tests
        # testMinifiedUnitTest, not testDebugUnitTest: `testBuildType = "minified"` scopes the test
        # components to that variant, so it is the only unit-test task AGP generates. Same JVM
        # tests, same sources - R8 is not involved in a unit test.
        # The JVM tests cover the offline logic (op application, outbox coalescing, checklist
        # ordering) and the widget's data contract (snapshot projection, prefs codec, colour
        # palette) — the parts with no server to fall back on.
        run: |
          chmod +x ./gradlew   # git tracks the exec bit, but keep this as a Windows-edit safety net
          ./gradlew :app:compileDebugKotlin :app:testMinifiedUnitTest --no-daemon
      - name: Build release + verify R8 keep rules
        # Until this existed, `release` was only ever built by a `v*` tag — so the minified config
        # reached users without a single PR having compiled it. Twice that shipped a widget that
        # never rendered. assembleRelease is finalizedBy verifyReleaseKeepRules, which reads R8's
        # own usage report and fails if anything we build reflectively lost its constructor.
        # No signing secrets needed: release is left unsigned when no keystore is configured.
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload test + R8 reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-results
          path: |
            app/app/build/reports/tests/testMinifiedUnitTest/
            app/app/build/outputs/mapping/release/usage.txt
          retention-days: 7

  android-instrumented:
    name: Android smoke tests (emulator, minified build)
    runs-on: ubuntu-latest
    # The one check that proves the shipped build actually runs. Everything else compiles code or
    # reads reports; this installs a fully R8'd APK on a device and starts it. It's the slowest job
    # here (~10 min) and runs in parallel with the fast ones, so it never gates them.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Hardware acceleration: without KVM the emulator falls back to software rendering and takes
      # long enough to blow the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34          # matches minSdk — the oldest device the app claims to support
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # `defaults.run.working-directory` above only applies to `run:` steps, not to an
          # action's inputs - without this the script runs at the repo root, where gradlew isn't.
          working-directory: app
          # `connectedMinifiedAndroidTest` runs against the `minified` variant: release's R8 config,
          # debug-signed so it installs without secrets. Running these against a debug build would
          # pass while proving nothing — see VariantSanityTest.
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedMinifiedAndroidTest --no-daemon

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-instrumented-results
          path: app/app/build/reports/androidTests/connected/
          retention-days: 7

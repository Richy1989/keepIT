name: CI

# Build and test every deployable on the way in, so a break is caught here rather than at
# `git tag v*` (release.yml) — which is the only workflow that used to compile anything.
# One job per deployable: they're independent by design (HTTP + WebSocket only), so they run in
# parallel and a red check names the culprit without reading the log.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch/PR makes the in-flight run obsolete — don't pay for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore keepIT/keepITCore.slnx
      - name: Build
        # --no-restore so a restore failure above is reported as its own step.
        run: dotnet build keepIT/keepITCore.slnx --configuration Release --no-restore
      - name: Test
        # The API in-process on throwaway SQLite data roots: upgrading an older database's schema,
        # and note images end to end (renditions, the lazily built preview, upload limits).
        run: dotnet test keepIT/keepITCore.slnx --configuration Release --no-build --logger trx --results-directory test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7

  image:
    name: Docker image smoke test (nginx + API)
    runs-on: ubuntu-latest
    # The one check on the image as it ships: nginx in front of the API, in one container. Every
    # other test talks to the API directly, so a proxy refusing what the API accepts is invisible to
    # them — which is how nginx's 1 MB default body limit turned away most phone photos while all of
    # CI stayed green. Also catches a broken Dockerfile before a release tag does.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the single-container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: keepit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it
        run: docker run -d --name keepit -p 8080:80 -e Jwt__Key="$(openssl rand -hex 32)" keepit:ci
      - name: Smoke test through nginx
        run: bash deploy/smoke-test.sh http://localhost:8080
      - name: No token from a URL reaches the container log
        # The browser's SignalR client sends its access token in the URL, and a reset link carries
        # its token in the page URL. nginx logs both redacted (deploy/nginx.conf).
        run: |
          curl -s -o /dev/null "http://localhost:8080/api/realtime?id=ci&access_token=ci-hub-secret"
          curl -s -o /dev/null "http://localhost:8080/reset-password?email=ci%40example.com&token=ci-reset-secret"
          sleep 1
          docker logs keepit 2>&1 | grep -q 'access_token=\[redacted\]' \
            || { echo "the hub request was not logged, or not in the redacted format"; exit 1; }
          if docker logs keepit 2>&1 | grep -E 'ci-(hub|reset)-secret'; then
            echo "a token from a URL reached the log"; exit 1
          fi
      - name: Container log
        if: failure()
        run: docker logs keepit

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        # `npm run build` is `tsc -b && vite build`: the typecheck is the real gate here, since the
        # generated API client means a changed C# DTO surfaces as TypeScript errors at every call
        # site. Building too proves the bundle still comes out.
        run: npm run build
      - name: Unit tests
        # Contrast of every design token against the surfaces it lands on, for all 3 themes x 8
        # accents, plus the masonry column packing. Both guard failures that are invisible rather
        # than loud: an unreadable token throws nothing and logs nothing, it is simply unreadable
        # for whoever picked that theme, and a grid that reads in the wrong order still renders.
        run: npm test

  android:
    name: Android (Kotlin + Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile + unit tests
        # testMinifiedUnitTest, not testDebugUnitTest: `testBuildType = "minified"` scopes the test
        # components to that variant, so it is the only unit-test task AGP generates. Same JVM
        # tests, same sources - R8 is not involved in a unit test.
        # The JVM tests cover the offline logic (op application, outbox coalescing, checklist
        # ordering) and the widget's data contract (snapshot projection, prefs codec, colour
        # palette) — the parts with no server to fall back on.
        run: |
          chmod +x ./gradlew   # git tracks the exec bit, but keep this as a Windows-edit safety net
          ./gradlew :app:compileDebugKotlin :app:testMinifiedUnitTest --no-daemon
      - name: Build release + verify R8 keep rules
        # Until this existed, `release` was only ever built by a `v*` tag — so the minified config
        # reached users without a single PR having compiled it. Twice that shipped a widget that
        # never rendered. assembleRelease is finalizedBy verifyReleaseKeepRules, which reads R8's
        # own usage report and fails if anything we build reflectively lost its constructor.
        # No signing secrets needed: release is left unsigned when no keystore is configured.
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload test + R8 reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            app/app/build/reports/tests/testMinifiedUnitTest/
            app/app/build/outputs/mapping/release/usage.txt
          retention-days: 7

  android-instrumented:
    name: Android smoke tests (emulator, minified build)
    runs-on: ubuntu-latest
    # The one check that proves the shipped build actually runs. Everything else compiles code or
    # reads reports; this installs a fully R8'd APK on a device and starts it. It's the slowest job
    # here (~10 min) and runs in parallel with the fast ones, so it never gates them.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Hardware acceleration: without KVM the emulator falls back to software rendering and takes
      # long enough to blow the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34          # matches minSdk — the oldest device the app claims to support
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # `defaults.run.working-directory` above only applies to `run:` steps, not to an
          # action's inputs - without this the script runs at the repo root, where gradlew isn't.
          working-directory: app
          # `connectedMinifiedAndroidTest` runs against the `minified` variant: release's R8 config,
          # debug-signed so it installs without secrets. Running these against a debug build would
          # pass while proving nothing — see VariantSanityTest.
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedMinifiedAndroidTest --no-daemon

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-results
          path: app/app/build/reports/androidTests/connected/
          retention-days: 7

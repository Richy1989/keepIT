# Serves the built SPA and reverse-proxies the API, so the whole app is one origin (no CORS, the
# refresh cookie is same-origin). /api is forwarded to the API container; everything else is a
# frontend asset or a client-side route, hence the index.html fallback.

# Map the Upgrade header so WebSocket requests upgrade and normal requests keep alive (SignalR).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the browser used. Behind a TLS proxy (Traefik, Nginx Proxy Manager, …) nginx itself is
# reached over plain http, so its own $scheme would tell the API "http"; pass the proxy's
# X-Forwarded-Proto on instead. The API marks the sign-in cookie Secure for HTTPS requests. A
# client that sends the header directly can only make its own cookie stricter.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The access log shares the container's output with the API's, and is written to match its lines:
# short, aligned and coloured (`docker logs` and Unraid's log view both show ANSI colour). The API
# logs every request it answers, so nginx logs only what never reached it: something nginx answered
# itself with an error (a missing asset, a body over the limit) or the API not answering at all.
# A file served, or a request handed to the API, writes nothing here.
#
# Only the path is logged, never the query string or the referer. Two credentials travel in URLs:
# the browser's SignalR client sends its access token as /api/realtime?…&access_token=…, and a
# password-reset link is /reset-password?email=…&token=…, whose URL then comes back as the referer
# of what that page loads. A log holding either hands a session or an account to whoever reads it.
#
# The formats hold the escape character (0x1B) literally, before each "[" of a colour code; most
# editors don't show it. Variables are still escaped, as nginx always does: a path can't add
# escapes of its own to a line.
map $time_iso8601 $log_time {
    "~T(?<log_hms>[0-9:]{8})"  $log_hms;
    default                    $time_iso8601;
}

# Something nginx answered itself with a 4xx (no upstream status). 499, a client that hung up, isn't
# news.
map "$upstream_status:$status" $log_client_error {
    ":499"   0;
    "~^:4"   1;
    default  0;
}

# A 5xx nginx answered itself, or the API not answering (502: not reachable, 504: timed out). A 5xx
# the API sent, it has logged.
map "$upstream_status:$status" $log_server_error {
    "~^:5"            1;
    "~^50[24]:50[24]$"  1;
    default           0;
}

# ASCII only, here and in the method column: nginx escapes every other byte of a variable.
map $status $log_hint {
    502      ": keepIT's app is not reachable";
    504      ": keepIT's app did not answer in time";
    default  "";
}

# Every GUID in the path cut to its first 8 characters, as the API's lines show them. A map can
# rewrite one match, so two chained maps cover the most any route has (a note and its media).
map $uri $log_uri_one {
    "~^(?<log_a1>.*?[0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<log_a2>.*)$"  "${log_a1}${log_a2}";
    default  $uri;
}

map $log_uri_one $log_uri {
    "~^(?<log_b1>.*?[0-9a-fA-F]{8})-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<log_b2>.*)$"  "${log_b1}${log_b2}";
    default  $log_uri_one;
}

# The method padded to the API's column, so the paths line up.
map $request_method $log_method {
    GET      "GET   ";
    HEAD     "HEAD  ";
    POST     "POST  ";
    PUT      "PUT   ";
    PATCH    "PATCH ";
    DELETE   "DELETE";
    default  $request_method;
}

log_format client_error '[38;5;244m$log_time[0m [38;5;42mINF[0m  [38;5;250m$log_method[0m [38;5;253m$log_uri[0m '
                        '[38;5;220m$status[0m  [38;5;244mnginx[0m';
log_format server_error '[38;5;244m$log_time[0m [1;38;5;231;48;5;160mERR[0m  [38;5;250m$log_method[0m [38;5;253m$log_uri[0m '
                        '[1;38;5;196m$status[0m  [38;5;244mnginx$log_hint[0m';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # To the container's output, where `docker logs` and Unraid show it and Docker's log rotation can
    # cap it (FAQ.md). Only what the API never saw; see the formats above.
    access_log /dev/stdout client_error if=$log_client_error;
    access_log /dev/stdout server_error if=$log_server_error;

    # Don't advertise the nginx version in responses/error pages.
    server_tokens off;

    # ---- Security headers (this instance may be exposed to the internet behind Traefik) ----
    # NOTE: nginx `add_header` inheritance is all-or-nothing — any location that sets its own
    # add_header (like /assets/ below) drops these and must repeat what it needs.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Origin only, even to ourselves: a reset page's URL carries its token, and a full-URL referer
    # would repeat it in every request the page makes, including nginx error lines, which quote the
    # referer whole. Nothing here reads the path from a referer.
    add_header Referrer-Policy strict-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Browsers ignore HSTS on plain-http responses, so this is inert for local/LAN use and becomes
    # effective automatically once the site is served through TLS (Traefik).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script 'unsafe-inline': index.html carries the pre-paint theme script.
    # style 'unsafe-inline': note colors are React inline style attributes.
    # connect-src 'self' covers same-origin fetch and the SignalR websocket (CSP3).
    # img-src/media-src blob:: attachments are fetched as authenticated Blobs and played or shown
    # from an object URL, never from a src the browser fetches itself - that is what keeps the
    # access token out of a URL. media-src has to say so separately: without it <audio> falls back
    # to default-src and a voice note renders as greyed-out, dead controls.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Forward API calls to the backend container. The /api prefix is preserved (the API routes
    # live under /api). Forwarded headers let the API recover the real client IP/scheme.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # nginx refuses request bodies over 1 MB unless told otherwise — which is most phone photos.
        # Match the API's own cap on a media upload (10 MB image + multipart framing), so the API
        # stays the one place that decides and can say why.
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # WebSocket upgrade for SignalR realtime.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Export streams a zip of the caller's whole account; import uploads one back. Both dwarf
        # anything else the API handles, so they get their own limits — the 12m above is sized for
        # a single photo and would 413 a real backup here at the proxy, before the API ever saw it
        # or could say why.
        # These blocks deliberately set no proxy_set_header: nginx's inheritance is all-or-nothing,
        # so setting one here would silently drop every header the parent block sets.
        location /api/import {
            proxy_pass http://api:8080;
            # Matches the API's own MaxArchiveBytes, so the API stays the one place that decides.
            client_max_body_size 256m;
            # Streamed straight to the API: buffering here would write the whole archive to nginx's
            # disk before the API writes it to its own spool, doubling the transient space a
            # restore needs.
            proxy_request_buffering off;
            # Re-decoding every image in a large archive takes longer than the 60s default.
            proxy_read_timeout 600s;
        }

        location /api/export {
            proxy_pass http://api:8080;
            # Hand the zip to the browser as it is produced rather than spooling it here first.
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # The hub's own location, only to keep its requests out of the error log: an error line
        # quotes the raw request, access token included, and can't be redacted. A failure here
        # still shows in the access log as a 502 (path only), and the API logs its side.
        location /api/realtime {
            proxy_pass http://api:8080;
            error_log /dev/null;
        }
    }

    # Long-cache fingerprinted assets. add_header here suppresses the server-level set, so repeat
    # the ones that matter for static files (CSP/X-Frame-Options are document-level — not needed).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
